<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist - AI Test Harness</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/harness.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="/harness" class="logo">AI Test Harness</a>
            <ul class="nav-links">
                <li><a href="/harness">Dashboard</a></li>
                <li><a href="/harness/config">Configure</a></li>
                <li><a href="/harness/models">Model Lab</a></li>
                <li><a href="/harness/api-testing">API Testing</a></li>
                <li><a href="/harness/network">Network</a></li>
                <li><a href="/harness/containers">Containers</a></li>
                <li><a href="/harness/evidence">Evidence</a></li>
                <li><a href="/harness/checklist">Checklist</a></li>
            </ul>
            <div class="user-menu">
                <a href="/dashboard" class="btn btn-secondary btn-sm">Back to VulnMS</a>
                <button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button>
            </div>
        </nav>
    </header>

    <div class="container">
        <h1 style="color: var(--accent-gold); margin-bottom: 0.5rem;">Deployment Checklist</h1>
        <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Track pre-engagement readiness. Every box should be checked before kickoff.</p>

        <!-- Progress -->
        <div class="card" style="margin-bottom: 1.5rem;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                <strong>Overall Progress</strong>
                <span id="progressText">--</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressBar" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Checklist Items -->
        <div id="checklistContainer">
            <div class="spinner"></div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/harness.js"></script>
    <script>
        if (!requireAuth()) throw new Error('Not authenticated');

        let checklistItems = [];

        async function loadChecklist() {
            try {
                const data = await HarnessAPI.getChecklist();
                checklistItems = data.items;
                renderChecklist();
            } catch (e) { showAlert('Failed to load checklist', 'error'); }
        }

        function renderChecklist() {
            const phases = {};
            checklistItems.forEach(item => {
                if (!phases[item.phase]) phases[item.phase] = [];
                phases[item.phase].push(item);
            });

            const done = checklistItems.filter(i => i.done).length;
            const total = checklistItems.length;
            const pct = total > 0 ? Math.round(done / total * 100) : 0;
            document.getElementById('progressText').textContent = `${done} / ${total} (${pct}%)`;
            document.getElementById('progressBar').style.width = `${pct}%`;

            let html = '';
            const phaseDescriptions = {
                'Phase 0': 'Base Workstation Setup',
                'Phase 1': 'ML Model Lab (by Aug 20)',
                'Phase 2': 'Container Pipeline (by Aug 21)',
                'Phase 3': 'Network & API Tooling (by Aug 22 — No-Go Date)',
                'Phase 4': 'API Testing Toolkit (by Aug 22)',
                'Phase 5': 'Evidence & Coordination (by Aug 23)',
            };

            for (const [phase, items] of Object.entries(phases)) {
                const phaseDone = items.filter(i => i.done).length;
                const phaseTotal = items.length;
                const phaseDesc = phaseDescriptions[phase] || '';
                html += `<div class="card checklist-phase">
                    <h3>${phase}: ${phaseDesc}
                        <span style="font-size: 0.875rem; font-weight: normal; color: var(--text-secondary); margin-left: 0.5rem;">
                            (${phaseDone}/${phaseTotal})
                        </span>
                    </h3>`;
                items.forEach(item => {
                    html += `<div class="checklist-item ${item.done ? 'done' : ''}">
                        <input type="checkbox" id="cb_${item.id}" ${item.done ? 'checked' : ''}
                               onchange="toggleItem('${item.id}', this.checked)">
                        <label for="cb_${item.id}">${item.text}</label>
                    </div>`;
                });
                html += '</div>';
            }
            document.getElementById('checklistContainer').innerHTML = html;
        }

        async function toggleItem(id, done) {
            const item = checklistItems.find(i => i.id === id);
            if (item) item.done = done;
            renderChecklist();
            try {
                await HarnessAPI.saveChecklist(checklistItems);
            } catch (e) { showAlert('Failed to save checklist', 'error'); }
        }

        loadChecklist();
    </script>
</body>
</html>
